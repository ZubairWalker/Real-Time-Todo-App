<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time TODO</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for in-browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Socket.IO client -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen py-8 px-4 sm:px-6">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const WORKSPACE = "default";
    const API_URL = "/api/todos";

    const getRandomName = () => {
      const names = ["Alice", "Bob", "Charlie", "Diana", "Ethan", "Fiona", "George", "Hannah"];
      const rand = Math.floor(100 + Math.random() * 900);
      return `${names[Math.floor(Math.random() * names.length)]}-${rand}`;
    };

    function App() {
      // User identity
      const [username, setUsername] = useState(() => localStorage.getItem("todo_username") || getRandomName());
      const [isEditingUser, setIsEditingUser] = useState(false);
      const [userDraft, setUserDraft] = useState(username);

      // Presence & Connection
      const [isConnected, setIsConnected] = useState(false);
      const [onlineCount, setOnlineCount] = useState(1);
      const [onlineUsers, setOnlineUsers] = useState([]);

      // Todos & Filters
      const [todos, setTodos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState("all"); // "all" | "active" | "completed"

      // New Todo Form
      const [title, setTitle] = useState("");
      const [priority, setPriority] = useState("MEDIUM");
      const [submitting, setSubmitting] = useState(false);

      // Typing indicator
      const [typingUser, setTypingUser] = useState(null);
      const typingTimeoutRef = useRef(null);
      const isTypingLocalRef = useRef(false);

      const socketRef = useRef(null);

      // 1. Initial REST Fetch
      const fetchTodos = async () => {
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          if (data.success && Array.isArray(data.data)) {
            setTodos(data.data);
          }
        } catch (err) {
          console.error("Failed to load todos:", err);
        } finally {
          setLoading(false);
        }
      };

      // 2. Setup Socket.IO connection and real-time listeners
      useEffect(() => {
        fetchTodos();

        const socket = io();
        socketRef.current = socket;

        socket.on("connect", () => {
          setIsConnected(true);
          socket.emit("workspace:join", { workspace: WORKSPACE, username });
        });

        socket.on("disconnect", () => {
          setIsConnected(false);
        });

        // Presence Update
        socket.on("presence:update", (payload) => {
          setOnlineCount(payload.online || 1);
          setOnlineUsers(payload.users || []);
        });

        // Real-time Created
        socket.on("todo:created", (newTodo) => {
          setTodos((prev) => {
            if (prev.some((t) => t._id === newTodo._id)) return prev;
            return [newTodo, ...prev];
          });
        });

        // Real-time Updated
        socket.on("todo:updated", (updatedTodo) => {
          setTodos((prev) =>
            prev.map((t) => (t._id === updatedTodo._id ? updatedTodo : t))
          );
        });

        // Real-time Deleted
        socket.on("todo:deleted", ({ id }) => {
          setTodos((prev) => prev.filter((t) => t._id !== id));
        });

        // Typing Indicator
        socket.on("typing:update", ({ username: typist, isTyping }) => {
          if (isTyping) {
            setTypingUser(typist);
            if (typingTimeoutRef.current) clearTimeout(typingTimeoutRef.current);
            typingTimeoutRef.current = setTimeout(() => setTypingUser(null), 2000);
          } else {
            setTypingUser(null);
          }
        });

        return () => {
          socket.disconnect();
        };
      }, []);

      // Handle username update
      const saveUsername = () => {
        const clean = userDraft.trim();
        if (!clean) return;
        setUsername(clean);
        localStorage.setItem("todo_username", clean);
        setIsEditingUser(false);
        if (socketRef.current?.connected) {
          socketRef.current.emit("workspace:join", { workspace: WORKSPACE, username: clean });
        }
      };

      // Handle typing events on input change
      const handleInputChange = (e) => {
        const val = e.target.value;
        setTitle(val);

        if (socketRef.current?.connected) {
          if (val.trim().length > 0 && !isTypingLocalRef.current) {
            isTypingLocalRef.current = true;
            socketRef.current.emit("typing", { workspace: WORKSPACE, isTyping: true, username });
          } else if (val.trim().length === 0 && isTypingLocalRef.current) {
            isTypingLocalRef.current = false;
            socketRef.current.emit("typing", { workspace: WORKSPACE, isTyping: false, username });
          }
        }
      };

      // Create Todo (REST)
      const handleCreate = async (e) => {
        e.preventDefault();
        const clean = title.trim();
        if (!clean) return;

        setSubmitting(true);
        try {
          if (socketRef.current && isTypingLocalRef.current) {
            isTypingLocalRef.current = false;
            socketRef.current.emit("typing", { workspace: WORKSPACE, isTyping: false, username });
          }

          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: clean, priority }),
          });

          const data = await res.json();
          if (data.success) {
            setTitle("");
          } else {
            alert(data.error || "Failed to create task");
          }
        } catch {
          alert("Network error creating task");
        } finally {
          setSubmitting(false);
        }
      };

      // Toggle Complete (REST)
      const handleToggle = async (todo) => {
        try {
          await fetch(`${API_URL}/${todo._id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ completed: !todo.completed }),
          });
        } catch {
          alert("Network error updating task");
        }
      };

      // Delete Todo (REST)
      const handleDelete = async (id) => {
        try {
          await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        } catch {
          alert("Network error deleting task");
        }
      };

      // Filtered items
      const filteredTodos = useMemo(() => {
        return todos.filter((todo) => {
          if (filter === "active") return !todo.completed;
          if (filter === "completed") return todo.completed;
          return true;
        });
      }, [todos, filter]);

      const counts = useMemo(() => ({
        all: todos.length,
        active: todos.filter((t) => !t.completed).length,
        completed: todos.filter((t) => t.completed).length,
      }), [todos]);

      const priorityColors = {
        HIGH: "text-red-600 bg-red-50 border-red-200",
        MEDIUM: "text-amber-600 bg-amber-50 border-amber-200",
        LOW: "text-blue-600 bg-blue-50 border-blue-200",
      };

      return (
        <div className="max-w-xl mx-auto">
          {/* Header */}
          <div className="flex items-center justify-between pb-6 mb-6 border-b border-gray-200">
            <div>
              <h1 className="text-2xl font-bold text-gray-900 tracking-tight">Shared Tasks</h1>
              <p className="text-xs text-gray-500 mt-0.5">Real-time collaborative board</p>
            </div>

            <div className="flex items-center gap-3">
              {/* Online Presence Pill */}
              <div
                className="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-medium cursor-help"
                title={onlineUsers.length ? `Online: ${onlineUsers.join(", ")}` : "Online count"}
              >
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>{onlineCount} online</span>
              </div>

              {/* Username Pill */}
              <div className="text-xs text-gray-600 bg-white border border-gray-200 rounded-full px-3 py-1 shadow-sm flex items-center gap-1.5">
                {isEditingUser ? (
                  <div className="flex items-center gap-1">
                    <input
                      type="text"
                      className="border border-gray-300 rounded px-1.5 py-0.5 text-xs text-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-500 w-24"
                      value={userDraft}
                      onChange={(e) => setUserDraft(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && saveUsername()}
                      autoFocus
                    />
                    <button
                      onClick={saveUsername}
                      className="text-[11px] text-blue-600 font-semibold hover:underline"
                    >
                      Save
                    </button>
                  </div>
                ) : (
                  <>
                    <span className="text-gray-400">You:</span>
                    <span className="font-medium text-gray-800">{username}</span>
                    <button
                      onClick={() => {
                        setUserDraft(username);
                        setIsEditingUser(true);
                      }}
                      className="text-gray-400 hover:text-gray-600 text-[11px] ml-0.5"
                    >
                      ✎
                    </button>
                  </>
                )}
              </div>
            </div>
          </div>

          {/* Create Task Input Card */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-3.5 mb-6">
            <form onSubmit={handleCreate} className="flex items-center gap-2">
              <input
                type="text"
                placeholder="What needs to be done?"
                value={title}
                onChange={handleInputChange}
                disabled={submitting}
                className="flex-1 text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition placeholder:text-gray-400"
                required
              />

              <select
                value={priority}
                onChange={(e) => setPriority(e.target.value)}
                className="text-xs px-2.5 py-2 border border-gray-200 rounded-lg bg-white text-gray-600 focus:outline-none focus:border-blue-500 cursor-pointer"
              >
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
              </select>

              <button
                type="submit"
                disabled={submitting || !title.trim()}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium rounded-lg shadow-sm transition"
              >
                Add
              </button>
            </form>

            {/* Subtle Typing Indicator */}
            {typingUser && (
              <p className="text-xs text-blue-600 mt-2 px-1 flex items-center gap-1.5 animate-pulse">
                <span>✍️</span> {typingUser} is typing...
              </p>
            )}
          </div>

          {/* Filter Bar */}
          <div className="flex items-center justify-between mb-4 px-1">
            <div className="flex items-center gap-1 bg-gray-100/80 p-1 rounded-lg text-xs font-medium text-gray-600">
              <button
                onClick={() => setFilter("all")}
                className={`px-3 py-1 rounded-md transition ${
                  filter === "all" ? "bg-white text-gray-900 shadow-sm" : "hover:text-gray-900"
                }`}
              >
                All ({counts.all})
              </button>
              <button
                onClick={() => setFilter("active")}
                className={`px-3 py-1 rounded-md transition ${
                  filter === "active" ? "bg-white text-gray-900 shadow-sm" : "hover:text-gray-900"
                }`}
              >
                Active ({counts.active})
              </button>
              <button
                onClick={() => setFilter("completed")}
                className={`px-3 py-1 rounded-md transition ${
                  filter === "completed" ? "bg-white text-gray-900 shadow-sm" : "hover:text-gray-900"
                }`}
              >
                Completed ({counts.completed})
              </button>
            </div>

            <span className="text-xs text-gray-400">
              {counts.active} {counts.active === 1 ? "task" : "tasks"} remaining
            </span>
          </div>

          {/* Task List */}
          <div className="space-y-2">
            {loading ? (
              <div className="text-center py-12 text-sm text-gray-400">
                Loading tasks...
              </div>
            ) : filteredTodos.length === 0 ? (
              <div className="text-center py-12 bg-white rounded-xl border border-dashed border-gray-200">
                <p className="text-sm font-medium text-gray-500">No tasks here</p>
                <p className="text-xs text-gray-400 mt-1">
                  {filter === "all" ? "Add your first task above!" : `No ${filter} tasks found.`}
                </p>
              </div>
            ) : (
              filteredTodos.map((todo) => (
                <div
                  key={todo._id}
                  className={`group flex items-center justify-between p-3.5 bg-white rounded-xl border transition shadow-sm ${
                    todo.completed ? "border-gray-100 bg-gray-50/60" : "border-gray-200 hover:border-gray-300"
                  }`}
                >
                  <label className="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={todo.completed}
                      onChange={() => handleToggle(todo)}
                      className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-gray-300 cursor-pointer transition"
                    />

                    <span
                      className={`text-sm truncate select-none transition ${
                        todo.completed ? "line-through text-gray-400" : "text-gray-800 font-normal"
                      }`}
                    >
                      {todo.title}
                    </span>
                  </label>

                  <div className="flex items-center gap-2 ml-3 shrink-0">
                    {/* Priority Tag */}
                    <span
                      className={`text-[10px] font-medium px-2 py-0.5 rounded-md border ${
                        priorityColors[todo.priority] || priorityColors.MEDIUM
                      }`}
                    >
                      {todo.priority}
                    </span>

                    {/* Delete Button */}
                    <button
                      onClick={() => handleDelete(todo._id)}
                      className="text-gray-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition"
                      title="Delete task"
                    >
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                      </svg>
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
